name: CI

on:
  push:
    branches: [main]
  pull_request:

# Hand-written CI gate (tasks.md 0.10). The full pipeline — Docker images,
# compose, CD, eval + a11y gates — is AI-generated in Phase 6 on top of this.
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24' # node:sqlite is unflagged from Node 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
