name: CI

# Full pipeline (tasks.md 6.3), AI-generated on top of the hand-written Phase 0
# skeleton (0.10). Three gates:
#   * hard gate  — build + deterministic tests + supply-chain audit. Any failure
#                  blocks. (`npm test` = vitest across every workspace: unit,
#                  acceptance/Gherkin, MCP contract, and both frontends.)
#   * a11y hard gate — axe-core runs inside the Playwright E2E; a violation fails
#                  the run.
#   * threshold gate — the eval sets block only when a metric drops below its
#                  committed floor (docs/*eval-trajectory.md). Needs a real model,
#                  so it runs on a schedule / manual dispatch (and on push/PR only
#                  when a model endpoint is configured), never faking a pass on a
#                  model-less runner.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC — the eval threshold gate's cadence.
  workflow_dispatch:

jobs:
  # --- Hard gate: build + deterministic tests + supply chain -----------------
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24' # node:sqlite is unflagged from Node 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Supply-chain audit (blocks on high + critical, minus allowlist)
        # Blocks on any high/critical advisory not covered by a non-expired,
        # justified entry in .audit-allowlist.json; moderate/low are not gated.
        run: npm run audit:ci
      - name: Infrastructure eval (third AI surface — static criteria)
        # Scores the AI-generated infra: builds / tests / deploys / readable.
        # Static mode here (no Docker on this job); the build + deploy criteria
        # are scored locally with `npm run eval:infra -- --full`. Blocks below 85%.
        run: npm run eval:infra

  # --- Hard gate: whole-system E2E + accessibility (axe-core) -----------------
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Playwright's own config boots the API (in-memory SQLite, ASSISTANT_STUB)
      # and both frontends and drives Chromium; axe-core gates a11y in the specs.
      # WebKit as well as Chromium: the participant journey runs on it because
      # that app is mobile-first and every iOS browser is WebKit underneath. A
      # Safari-only session defect reached a real device while this said
      # `chromium` alone.
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
        env:
          CI: 'true'
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # --- Threshold gate: eval sets (real model; block on regression) -----------
  evals:
    # No model on GitHub-hosted runners, so this runs only where one is
    # configured — the repo VARIABLE LLM_BASE_URL, on any trigger. It never runs
    # model-less: a skipped job is honest, a faked pass is not.
    #
    # The condition used to let `schedule` and `workflow_dispatch` through on
    # their own, which is not what that sentence promised. Dispatched on a
    # repository with nothing configured, every case errored ("Failed to parse
    # URL from /chat/completions"), the report read 100% over 0 turns, and the
    # gate passed. Monday's cron would have done the same, weekly. The gate
    # itself now refuses a run that scored nothing (`checkRun`); this stops such
    # a run being started in the first place.
    #
    # `vars` and not `secrets`: a job-level `if` cannot read the secrets context.
    # The endpoint is not a secret and belongs in a variable; LLM_API_KEY stays a
    # secret and is read below, where secrets are available.
    #
    # Run it locally anytime with:
    #   npm run eval:creation -- --out reports/creation.json
    #   npm run eval:gate -- --suite creation --report reports/creation.json
    if: vars.LLM_BASE_URL != ''
    runs-on: ubuntu-latest
    env:
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || vars.LLM_BASE_URL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Contest-creation eval + threshold gate
        run: |
          npm run eval:creation -- --out reports/creation.json
          npm run eval:gate -- --suite creation --report reports/creation.json
      - name: Host-assistant eval + threshold gate
        run: |
          npm run eval:host-assistant -- --out reports/host-assistant.json
          npm run eval:gate -- --suite host-assistant --report reports/host-assistant.json
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: eval-reports
          path: reports/
          retention-days: 30
